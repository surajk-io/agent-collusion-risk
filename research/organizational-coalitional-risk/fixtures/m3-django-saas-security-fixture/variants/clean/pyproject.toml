[project]
name = "django-saas-starter"
version = "0.1.0"
description = "Production-grade Django multi-tenant SaaS starter with row-level tenancy, RBAC, and invitations."
authors = [{ name = "Maxim Chumakov" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, DJ: flake8-django
select = ["E", "W", "F", "I", "UP", "B", "DJ"]
ignore = [
    "E501",   # line length handled by formatter
    "B904",   # raise ... from is noisy for DRF exceptions
]

[tool.ruff.lint.per-file-ignores]
"*/settings/*" = ["F405", "F403"]
"tests/*" = ["S101"]
# The tenant-scoped base model declares two managers (scoped + unscoped escape
# hatch) right after its single field; that ordering is intentional and required
# (the scoped `objects` must be the default manager), so DJ012 is silenced here.
"apps/common/models.py" = ["DJ012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]
addopts = "-q --reuse-db"
